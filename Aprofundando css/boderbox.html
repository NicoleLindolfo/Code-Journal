<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box-Model</title>
  </head>
  <body>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        font-size: 62.5%;
      }

      div {
        border: solid 2px #000;
        padding: 1rem;
        height: 20rem;
      }

      h1 {
        margin-bottom: 2rem;
        font-size: 3.2rem;
      }

      h2 {
        margin-bottom: 1rem;
        font-size: 2.4rem;
      }

      p {
        margin-bottom: 0.5rem;
        font-size: 1.6rem;
      }

      h3 {
        margin: 2rem;
        padding-left: 2rem;
      font-size: 2.4rem;
        border: solid 0.1rem red; 
      }

      h4 {
        text-transform: uppercase;
        border: solid 0.1rem black;
        padding-left: 1rem;
        font-size: 1.8rem;
      }
    </style>

    <div>
      <h1>Meu título principal</h1>
      <h2>Meu título secundario</h2>
      <p>Meu paragrafo</p>
    </div>

    <h3>Testando paragráfro com borda</h3>

    <h4>
      para colocar a borda, primeiro no seletor universal coloca box-sizing: border-box, depois na estilização coloca border: solid grossura e cor.
    </h4>
  </body>
</html>
