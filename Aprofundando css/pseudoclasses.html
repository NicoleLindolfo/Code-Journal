<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pseudo-Classes</title>
  </head>
  <body>
    <style>
      /* LVHA: Link, Visited, Hover, Active */
      p:hover {
        color: blueviolet;
      }

      a:link {
        font-weight: 700;
      }

      a:visited {
        color: brown;
      }

      a:hover {
        font-size: larger;
      }

      a:active {
        color: yellow;
      }
    </style>

    <p>Parágrafo</p>

    <a
      href="https://support.google.com/websearch/answer/118238?hl=pt-BR&co=GENIE.Platform%3DAndroid"
      >google.com</a
    >
  </body>
</html>
