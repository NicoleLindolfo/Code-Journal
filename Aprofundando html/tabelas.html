<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabelas</title>
  </head>
  <body>
    <main>
      <section>
        <table>
          <caption>
            Legenda da tabela
          </caption>
          <colgroup>
            <col span="2" style="background-color: blue" />
            <col />
          </colgroup>
          <thead>
            <tr>
              <th>Coluna 1</th>
              <th>Coluna 2</th>
              <th>Coluna 3</th>
            </tr>
          </thead>
          <!-- tr= table row. td= table data -->
          <tbory>
            <tr>
              <td>informação 1</td>
              <td>informação 2</td>
              <td>informação 3</td>
            </tr>
            <tr>
              <td>informação 4</td>
              <td>informação 5</td>
              <td>informação 6</td>
            </tr>
          </tbory>

          <tfoot>
            <tr>
              <td>Rodapé 1</td>
              <td>Rodapé 2</td>
              <td>Rodapé 3</td>
            </tr>
          </tfoot>
        </table>
      </section>
    </main>
  </body>
</html>
