<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
  </head>
  <body>
    <main>
      <section>
        <h2>Formulário</h2>

        <form action="">
          <div>
            <label for="nome">Nome (Apenas letras)</label>
            <input
              id="nome"
              name="name"
              type="text"
              placeholder="Seu primeiro nome"
              pattern="[a-zA-Z]+"
              required
              title="Esse input só aceita letras, não aceita números"
            />
          </div>
          <div>
            <label for="email">E-mail</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="Seu melhor E-mail"
              pattern="[a-zA-Z]+"
              required
              title="Esse input só aceita letras, não aceita números"
            />
          </div>
          <div><button type="submit">Enviar</button></div>
        </form>
      </section>
    </main>
  </body>
</html>
