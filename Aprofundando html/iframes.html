<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iframes</title>
  </head>
  <body>
    <main>
      <section>
        <iframe
          object-position="center"
          width="560"
          height="315"
          src="https://www.youtube.com/embed/nkEOuw_BQj8?si=OCAsz36QhEX9AMfR"
          title="YouTube video player"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </section>
      <br />
      <br />
      <br />
      <br />
      <br />
      <br />
      <br />
      <h1>Dialog</h1>
      <section>
        <button class="js-abrir">Abrir</button>
        <dialog>
          <p>
            Lorem Ipsum is simply dummy text of the printing and typesetting
            industry. Lorem Ipsum has been the industry's standard dummy text
            ever since the 1500s, when an unknown printer took a galley of type
            and scrambled it to make a type specimen book
          </p>
          <button class="js-fechar">fechar</button>
        </dialog>

        <script>
          let elembotaoabrir = document.querySelector(".js-abrir");
          let elembotaofechar = document.querySelector(".js-fechar");
          let elemdialog = document.querySelector("dialog");

          elembotaoabrir.addEventListener("click", () => {
            elemdialog.showModal();
          });

          elembotaofechar.addEventListener("click", () => {
            elemdialog.close();
          });
        </script>
      </section>
    </main>
  </body>
</html>
